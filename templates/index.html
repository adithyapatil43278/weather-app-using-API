<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Temperature Checker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <style>
        :root{--bg:#f5f7fb;--card:#ffffff;--accent:#2563eb;--muted:#6b7280}
        body{font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:#111;margin:0;padding:24px;display:flex;justify-content:center}
        .card{background:var(--card);max-width:820px;width:100%;padding:20px;border-radius:12px;box-shadow:0 6px 18px rgba(16,24,40,0.08)}
        h1{margin:0 0 12px 0;font-size:20px}
        .row{display:flex;gap:12px;align-items:center}
        input[type="text"], input[type="number"], button{padding:10px 12px;border-radius:8px;border:1px solid #e6edf3}
        input[type="text"]{flex:1}
        button{background:var(--accent);color:white;border:none;cursor:pointer}
        button:disabled{opacity:.6;cursor:not-allowed}
        #output{margin-top:12px;font-weight:600}
        .controls{margin-top:12px;display:flex;gap:12px;align-items:center}
        .muted{color:var(--muted);font-size:13px}
        #suggestions{width:100%;border:1px solid #e6edf3;border-radius:8px;margin-top:6px;max-height:160px;overflow:auto;display:none;background:white}
        #suggestions li{padding:8px 10px;cursor:pointer}
        #suggestions li:hover{background:#f1f5f9}
        .footer{margin-top:14px;font-size:13px;color:var(--muted)}
        @media (max-width:520px){.row{flex-direction:column;align-items:stretch}}
    </style>
</head>
<body>
    <div class="card">
        <h1>Temperature Checker</h1>

        <div class="row">
            <input id="city" type="text" placeholder="Enter city (e.g. London)" autocomplete="off">
            <button id="checkBtn">Check</button>
        </div>

        <ul id="suggestions" role="list"></ul>

        <div class="controls">
            <label class="muted"><input id="autoRefresh" type="checkbox"> Auto-refresh</label>
            <label class="muted">Interval: <input id="intervalSec" type="number" min="5" value="15" style="width:72px;margin-left:6px"> seconds</label>
            <button id="clearBtn" style="background:#ef4444">Clear Chart</button>
        </div>

        <p id="output" class="muted">No data yet.</p>

        <div style="margin-top:16px">
            <canvas id="chart" height="120"></canvas>
        </div>

        <div class="footer">Data from <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a>. Suggestions powered by geocoding.</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Client-side enhancements: suggestions, auto-refresh, history chart
        const cityInput = document.getElementById('city');
        const checkBtn = document.getElementById('checkBtn');
        const output = document.getElementById('output');
        const suggestionsEl = document.getElementById('suggestions');
        const autoRefresh = document.getElementById('autoRefresh');
        const intervalSec = document.getElementById('intervalSec');
        const clearBtn = document.getElementById('clearBtn');

        let timer = null;
        let history = [];
        const maxHistory = 30;

        // Chart.js setup
        const palette = ['#ef4444','#2563eb','#16a34a','#f59e0b','#7c3aed','#06b6d4','#ef6aa7'];
        function pickColor(city){
            if(!city) return palette[0];
            let h=0; for(let i=0;i<city.length;i++) h = (h<<5) - h + city.charCodeAt(i);
            return palette[Math.abs(h) % palette.length];
        }

        const ctx = document.getElementById('chart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Temperature (°C)',
                    data: [],
                    borderColor: '#ef4444',
                    backgroundColor: 'rgba(239,68,68,0.12)',
                    pointBackgroundColor: [],
                    tension: 0.35
                }]
            },
            options: {
                responsive: true,
                scales: { x: { display: true }, y: { beginAtZero: false } },
                plugins: {
                    tooltip: {
                        callbacks: {
                            title: function(context){
                                const idx = context && context[0] && context[0].dataIndex;
                                const h = history[idx];
                                return h ? h.time.toLocaleString() : '';
                            },
                            label: function(context){
                                const idx = context.dataIndex;
                                const h = history[idx];
                                if(!h) return context.formattedValue + '°C';
                                return (h.city? (h.city + ': ') : '') + h.temp + '°C';
                            }
                        }
                    }
                }
            }
        });

        async function getTemp() {
            const city = cityInput.value.trim();
            if (!city) { output.textContent = 'Please enter a city.'; output.className='muted'; return; }
            checkBtn.disabled = true;
            output.textContent = 'Loading...';
            try {
                // prefer canonical query saved from suggestion click when available
                const query = cityInput.dataset.query || city;
                const res = await fetch(`/temperature?city=${encodeURIComponent(query)}`);
                if (!res.ok) {
                    const err = await res.json().catch(()=>({error:'Unknown error'}));
                    throw new Error(err.error || ('Status '+res.status));
                }
                const data = await res.json();
                const t = data.temperature;
                const now = new Date();
                const cityName = data.city || city;
                output.textContent = `Temp in ${cityName}: ${t}°C — ${now.toLocaleTimeString()}`;
                output.className='';

                // clear any stored canonical query after a successful lookup
                try{ delete cityInput.dataset.query }catch(e){}

                // push to history and update chart
                history.push({time: now, temp: t, city: cityName});
                if (history.length>maxHistory) history.shift();
                chart.data.labels = history.map(h => h.time.toLocaleTimeString());
                chart.data.datasets[0].data = history.map(h => h.temp);
                chart.data.datasets[0].pointBackgroundColor = history.map(h => pickColor(h.city));
                chart.update();
            } catch (err) {
                output.textContent = 'Error: ' + err.message;
                output.className='muted';
            } finally {
                checkBtn.disabled = false;
            }
        }

        // Suggestions (debounced)
        let suggestTimer = null;
        cityInput.addEventListener('input', () => {
            const q = cityInput.value.trim();
            // user typed a new value; drop any previously-selected canonical query
            try{ delete cityInput.dataset.query }catch(e){}
            if (suggestTimer) clearTimeout(suggestTimer);
            if (!q) { suggestionsEl.style.display='none'; suggestionsEl.innerHTML=''; return; }
            suggestTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`/suggest?q=${encodeURIComponent(q)}`);
                    if (!res.ok) throw new Error('Failed to fetch suggestions');
                    const items = await res.json();
                    suggestionsEl.innerHTML = '';
                    if (!items || items.length===0) { suggestionsEl.style.display='none'; return; }
                    for (const it of items) {
                        const li = document.createElement('li');
                        li.textContent = it.display || it.name;
                        // store canonical name for queries to avoid 'Name, Region' search issues
                        if (it.name) li.dataset.query = it.name;
                        li.addEventListener('click', () => {
                            cityInput.value = (it.display||it.name);
                            if (it.name) cityInput.dataset.query = it.name; else try{ delete cityInput.dataset.query }catch(e){}
                            suggestionsEl.style.display='none';
                            getTemp();
                        });
                        suggestionsEl.appendChild(li);
                    }
                    suggestionsEl.style.display='block';
                } catch (e) { suggestionsEl.style.display='none'; }
            }, 300);
        });

        // Auto refresh logic
        function startAutoRefresh() {
            stopAutoRefresh();
            const sec = Math.max(5, parseInt(intervalSec.value)||15);
            timer = setInterval(() => { getTemp(); }, sec*1000);
        }
        function stopAutoRefresh(){ if (timer) { clearInterval(timer); timer=null; } }

        autoRefresh.addEventListener('change', () => { if (autoRefresh.checked) startAutoRefresh(); else stopAutoRefresh(); });
        intervalSec.addEventListener('change', () => { if (autoRefresh.checked) startAutoRefresh(); });

        checkBtn.addEventListener('click', getTemp);
        clearBtn.addEventListener('click', () => { history = []; chart.data.labels = []; chart.data.datasets[0].data = []; chart.data.datasets[0].pointBackgroundColor = []; chart.update(); output.textContent='Cleared chart.'; });

        // Close suggestions when clicking outside
        document.addEventListener('click', (ev) => { if (!suggestionsEl.contains(ev.target) && ev.target!==cityInput) suggestionsEl.style.display='none'; });
    </script>
</body>
</html>
